name: Dim0 MCP plugin package

on:
  push:
    paths:
      - ".github/workflows/dim0-plugin-package.yml"
      - "plugins/dim0/**"
      - "scripts/package-dim0-openai.mjs"
      - "scripts/test-package-dim0-openai.mjs"
      - "integrations/dim0-mcp-plugin/scripts/build.mjs"
  pull_request:
    paths:
      - ".github/workflows/dim0-plugin-package.yml"
      - "plugins/dim0/**"
      - "scripts/package-dim0-openai.mjs"
      - "scripts/test-package-dim0-openai.mjs"
      - "integrations/dim0-mcp-plugin/scripts/build.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Validate portable + legacy ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify zip utilities
        run: command -v zip && command -v unzip
      - name: Validate the portable package, legacy compatibility and failure rollback
        run: node --test scripts/test-package-dim0-openai.mjs
